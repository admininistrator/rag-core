services:
  storage-fixture:
    profiles: [storage-test]
    image: rag-core-mc:local
    build:
      context: .
      dockerfile: docker/mc.Dockerfile
    entrypoint: ["/bin/sh", "/fixture/provision.sh"]
    volumes:
      - ./tests/fixtures/storage/provision.sh:/fixture/provision.sh:ro
      - ./tests/fixtures/storage/reader.json:/fixture/reader.json:ro
      - ./tests/fixtures/storage/uploader.json:/fixture/uploader.json:ro
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_reader_user
      - minio_reader_password
      - minio_uploader_user
      - minio_uploader_password
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]

secrets:
  minio_reader_user:
    file: ./.local/secrets/minio_reader_user
  minio_reader_password:
    file: ./.local/secrets/minio_reader_password
  minio_uploader_user:
    file: ./.local/secrets/minio_uploader_user
  minio_uploader_password:
    file: ./.local/secrets/minio_uploader_password
