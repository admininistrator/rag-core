# Isolated T19 real-stack acceptance, no application/Scarlet networks or data volumes.
name: rag-core-ingestion-test
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: t10_acceptance
      POSTGRES_USER: rag_core_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag_core_test -d t10_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.19.1-unprivileged@sha256:801777072776dc81b2a9dd2007b2ed487571f21ecd30efffd15ddb1671f2193d
    tmpfs: ["/qdrant/storage:uid=1000,gid=1000,mode=0700"]
    healthcheck:
      test: [CMD-SHELL, "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    entrypoint: [/bin/sh, -c]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"
        exec minio server /data
    secrets: [minio_root_user, minio_root_password]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
  storage-fixture:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    entrypoint: [/bin/sh, /fixture/provision.sh]
    volumes:
      - ./tests/fixtures/storage/provision.sh:/fixture/provision.sh:ro
      - ./tests/fixtures/storage/reader.json:/fixture/reader.json:ro
      - ./tests/fixtures/storage/uploader.json:/fixture/uploader.json:ro
    secrets: [minio_root_user, minio_root_password, minio_reader_user, minio_reader_password, minio_uploader_user, minio_uploader_password]
    depends_on:
      minio: {condition: service_healthy}
  inference:
    image: rag-core-inference:t17-cpu
    environment: {MODEL_CACHE: /models, MODEL_DEVICE: cpu}
    volumes: ["model_cache:/models:ro"]
    init: true
    mem_limit: 7g
    cpus: 2
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
  ingestion-tests:
    image: rag-core-ingestion-test:t19
    build: {context: ., dockerfile: docker/worker.Dockerfile, target: ingestion-test}
    environment:
      RAG_TEST_COMPOSE_ISOLATED: "1"
      RAG_TEST_DATABASE_URL: postgresql://rag_core_test@postgres:5432/t10_acceptance
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_URL: redis://redis:6379/15
      INFERENCE_URL: http://inference:8080
      QDRANT_URL: http://qdrant:6333
    secrets: [postgres_password, minio_reader_user, minio_reader_password, minio_uploader_user, minio_uploader_password]
    volumes: ["model_cache:/models:ro"]
    init: true
    mem_limit: 2g
    cpus: 2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      inference: {condition: service_healthy}
      storage-fixture: {condition: service_completed_successfully}
volumes:
  model_cache: {external: true, name: rag-core_model_cache}
secrets:
  postgres_password: {file: ./.local/secrets/t10_postgres_password}
  minio_root_user: {file: ./.local/secrets/minio_root_user}
  minio_root_password: {file: ./.local/secrets/minio_root_password}
  minio_reader_user: {file: ./.local/secrets/minio_reader_user}
  minio_reader_password: {file: ./.local/secrets/minio_reader_password}
  minio_uploader_user: {file: ./.local/secrets/minio_uploader_user}
  minio_uploader_password: {file: ./.local/secrets/minio_uploader_password}
