[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-core"
version = "0.1.0"
description = "Local-first RAG service for session-scoped document retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
]

[dependency-groups]
api = [
  {include-group = "metadata"},
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]==2.15.0",
  "redis>=6.2,<8",
  "uvicorn[standard]>=0.35,<1",
]
ingestion = [
  {include-group = "metadata"},
  "boto3>=1.39,<2",
  "celery>=5.5,<6",
  "defusedxml==0.7.1",
  "docling-parse==7.22.1",
  "openpyxl==3.1.5",
  "pypdf[crypto]==6.19.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "qdrant-client>=1.15,<2",
  "redis>=6.2,<8",
]
metadata = [
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
]
# T17 will add and pin heavyweight model runtimes only after CPU/GPU validation.
inference = []
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pyarrow==25.0.1",
  "pypdf[crypto]==6.19.0",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".uv-cache",
  ".uv-python",
  ".venv",
  "corpus-documents/.downloads",
  "corpus-documents/*/documents",
  "corpus-documents/*/raw",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: isolated tests without external services or network access",
  "integration: tests against real local service dependencies",
  "contract: API and adapter contract tests",
  "e2e: end-to-end application flows",
  "security: authorization, isolation, and unsafe-input tests",
  "live: explicit tests that use real external providers or upstream sources",
  "slow: tests excluded from the fast local feedback loop",
]
