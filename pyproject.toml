[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-core"
version = "0.1.0"
description = "Local-first RAG service for session-scoped document retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
]

[dependency-groups]
api = [
  {include-group = "metadata"},
  "anthropic==1.11.0",
  "boto3>=1.39,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]==2.15.0",
  "redis>=6.2,<8",
  "qdrant-client>=1.15,<2",
  "tokenizers==0.22.2",
  "uvicorn[standard]>=0.35,<1",
]
ingestion = [
  {include-group = "metadata"},
  "boto3>=1.39,<2",
  "celery>=5.5,<6",
  "httpx>=0.28,<1",
  "defusedxml==0.7.1",
  "docling-parse==7.22.1",
  "docling-slim[convert-core]==2.132.0",
  "pandas==3.0.6",
  "pypdfium2==5.13.0",
  "openpyxl==3.1.5",
  "pypdf[crypto]==6.19.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "qdrant-client>=1.15,<2",
  "redis>=6.2,<8",
  "tokenizers==0.22.2",
]
metadata = [
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
]
# One dedicated service owns models; these groups never enter API/ingestion images.
inference-runtime = [
  "FlagEmbedding==1.3.5",
  "transformers==4.57.6",
  "sentence-transformers==5.1.2",
  "peft==0.17.1",
  "tokenizers==0.22.2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
  "psutil==7.2.2",
]
inference = [{include-group = "inference-runtime"}, "torch==2.9.1"]
inference-gpu = [{include-group = "inference-runtime"}, "torch==2.9.1"]
ocr-test = ["pytest>=8.4,<10"]
ingestion-test = [{include-group = "ocr-test"}, "pytest-asyncio>=1.1,<2"]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pyarrow==25.0.1",
  "pypdf[crypto]==6.19.0",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".uv-cache",
  ".uv-python",
  ".venv",
  "corpus-documents/.downloads",
  "corpus-documents/*/documents",
  "corpus-documents/*/raw",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]  # Shared test fixtures are imported through the local tests namespace.
markers = [
  "unit: isolated tests without external services or network access",
  "integration: tests against real local service dependencies",
  "contract: API and adapter contract tests",
  "e2e: end-to-end application flows",
  "security: authorization, isolation, and unsafe-input tests",
  "live: explicit tests that use real external providers or upstream sources",
  "slow: tests excluded from the fast local feedback loop",
]

[tool.uv]
conflicts = [[{group = "inference"}, {group = "inference-gpu"}]]

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", group = "inference"},
  {index = "pytorch-cu128", group = "inference-gpu"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
